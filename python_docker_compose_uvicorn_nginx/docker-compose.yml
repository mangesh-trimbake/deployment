version: "3.9"

services:

  flask:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flask_container

    expose:
      - "8000"

    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx

    container_name: nginx_container

    ports:
      - "80:80"

    depends_on:
      - flask

    restart: unless-stopped